name: Generate Activity Graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activity-graph.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          username: vijaysai1102
          output_path: assets/activity-graph.svg
          options: custom_title=Contribution%20Activity&bg_color=0D1117&color=C9D1D9&title_color=0D9488&line=0D9488&point=FFFFFF&area=true&area_color=0D9488&hide_border=true&radius=6

      - name: Commit and push activity graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update assets/activity-graph.svg - [Skip GitHub Action]"
            git push
          fi
